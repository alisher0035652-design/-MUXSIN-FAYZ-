{% extends "base.html" %}
{% block content %}
<h2>Управление справочниками</h2>
<div class="row mt-4">
    <div class="col-md-6">
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-dark text-white">Номенклатура товара</div>
            <div class="card-body">
                <form action="{{ url_for('add_item') }}" method="POST" class="mb-3">
                    <div class="input-group">
                        <input type="text" name="name" class="form-control" placeholder="Наименование товара" required>
                        <input type="text" name="unit" class="form-control" placeholder="Ед. изм." required style="max-width: 120px;">
                        <button type="submit" class="btn btn-primary">Добавить</button>
                    </div>
                </form>
                <div style="max-height: 350px; overflow-y: auto;">
                    <table class="table table-sm table-striped">
                        <thead><tr><th>Товар</th><th>Ед.</th><th></th></tr></thead>
                        <tbody>
                            {% for i in items %}
                            <tr>
                                <td>{{ i.name }}</td>
                                <td>{{ i.unit }}</td>
                                <td class="text-end">
                                    <form action="{{ url_for('delete_item', id=i.id) }}" method="POST" style="display:inline;">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Удалить товар?')">×</button>
                                    </form>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-dark text-white">Клиенты (Район и Город)</div>
            <div class="card-body">
                <form action="{{ url_for('add_client') }}" method="POST" class="mb-3">
                    <div class="input-group">
                        <input type="text" name="district" class="form-control" placeholder="Район" required>
                        <input type="text" name="city" class="form-control" placeholder="Город">
                        <button type="submit" class="btn btn-success">Добавить</button>
                    </div>
                </form>
                <div style="max-height: 350px; overflow-y: auto;">
                    <table class="table table-sm table-striped">
                        <thead><tr><th>Район</th><th>Город</th><th></th></tr></thead>
                        <tbody>
                            {% for c in clients %}
                            <tr>
                                <td>{{ c.district }}</td>
                                <td>{{ c.city }}</td>
                                <td class="text-end">
                                    <form action="{{ url_for('delete_client', id=c.id) }}" method="POST" style="display:inline;">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Удалить клиента?')">×</button>
                                    </form>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
