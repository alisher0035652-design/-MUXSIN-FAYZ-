{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Отгрузки (Накладные)</h2>
    <div>
       <a href="{{ url_for('export_sales_excel') }}" class="btn btn-outline-success me-2">📥 Экспорт в Excel</a>
    </div>
</div>

<div class="card mb-4 shadow-sm border-primary">
    <div class="card-header bg-primary text-white fw-bold">Оформление новой отгрузки</div>
    <div class="card-body">
        <form action="{{ url_for('sales') }}" method="POST" id="salesForm">
            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label fw-bold">Дата</label>
                    <input type="date" name="date" class="form-control" required value="{{ current_date or '' }}">
                </div>
                <div class="col-md-8">
                    <label class="form-label fw-bold">Детский сад (МТТ)</label>
                    <select name="client_id" class="form-select" required>
                        <option value="">Выберите МТТ...</option>
                        {% for c in clients %}
                        <option value="{{ c.id }}">{{ c.category }} № {{ c.client_number }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <!-- Кнопка сканирования камеры -->
            <div class="mb-3 d-grid">
                <button type="button" class="btn btn-success btn-lg" id="startScanBtn">
                    📷 Сканировать товар камерой смартфона
                </button>
            </div>

            <div class="table-responsive mb-3">
                <table class="table table-bordered align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Товар</th>
                            <th style="width: 160px;">Количество (кг/шт)</th>
                            <th style="width: 100px;">Ед. изм.</th>
                            <th style="width: 80px;">Действие</th>
                        </tr>
                    </thead>
                    <tbody id="saleItemsBody">
                        <!-- Сюда добавляются отсканированные товары -->
                    </tbody>
                </table>
            </div>

            <div class="d-flex justify-content-between">
                <button type="button" class="btn btn-outline-secondary" onclick="addManualRow()">+ Выбрать из списка вручную</button>
                <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">Сохранить отгрузку</button>
            </div>
        </form>
    </div>
</div>

<!-- Модальное окно сканера -->
<div class="modal fade" id="scannerModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Сканирование штрихкода</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body text-center">
        <video id="video" style="width: 100%; max-height: 250px; border: 2px dashed #0d6efd; border-radius: 8px;"></video>
        <div id="scanStatus" class="mt-2 text-primary fw-bold">Наведите камеру на штрихкод товара</div>
        <hr>
        <div class="input-group">
            <input type="text" id="manualBarcode" class="form-control" placeholder="Или введите штрихкод вручную">
            <button class="btn btn-outline-secondary" type="button" onclick="submitManualBarcode()">Добавить</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let codeReader = null;

document.getElementById('startScanBtn').addEventListener('click', function () {
    let modal = new bootstrap.Modal(document.getElementById('scannerModal'));
    modal.show();
    
    codeReader = new ZXing.BrowserBarcodeReader();
    document.getElementById('scanStatus').innerText = "Инициализация камеры...";
    
    // Получаем список видеоустройств (камер)
    codeReader.listVideoInputDevices()
        .then((videoInputDevices) => {
            let selectedDeviceId = videoInputDevices[0].deviceId;
            
            // Пытаемся найти заднюю камеру (environment) для телефона
            for (let device of videoInputDevices) {
                if (device.label.toLowerCase().includes('back') || 
                    device.label.toLowerCase().includes('задняя') || 
                    device.label.toLowerCase().includes('rear') ||
                    device.label.toLowerCase().includes('environment')) {
                    selectedDeviceId = device.deviceId;
                    break;
                }
            }
            
            // Если камер несколько и последняя обычно основная на Android/iOS
            if (videoInputDevices.length > 1) {
                selectedDeviceId = videoInputDevices[videoInputDevices.length - 1].deviceId;
            }

            document.getElementById('scanStatus').innerText = "Наведите камеру на штрихкод...";

            return codeReader.decodeFromVideoDevice(selectedDeviceId, 'video', (result, err) => {
                if (result) {
                    document.getElementById('scanStatus').innerText = "Штрихкод найден: " + result.text;
                    processBarcode(result.text);
                    codeReader.reset();
                    modal.hide();
                }
            });
        })
        .catch(err => {
            console.error(err);
            document.getElementById('scanStatus').innerText = "Ошибка камеры. Проверьте разрешения HTTPS.";
        });
});

document.getElementById('scannerModal').addEventListener('hidden.bs.modal', function () {
    if (codeReader) {
        codeReader.reset();
    }
});
function submitManualBarcode() {
    let val = document.getElementById('manualBarcode').value.trim();
    if (val) {
        processBarcode(val);
        document.getElementById('manualBarcode').value = '';
        bootstrap.Modal.getInstance(document.getElementById('scannerModal')).hide();
    }
}

function processBarcode(barcode) {
    fetch('/api/get_item_by_barcode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ barcode: barcode })
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            addItemToTable(data.item);
        } else {
            alert(data.error);
        }
    })
    .catch(err => alert("Ошибка связи с сервером: " + err));
}

function addItemToTable(item) {
    let existingRow = document.getElementById('row-item-' + item.id);
    if (existingRow) {
        // Автоматическое суммирование при повторном сканировании (п. 5 ТЗ)
        let qtyInput = existingRow.querySelector('.item-qty');
        let currentQty = parseFloat(qtyInput.value) || 0;
        qtyInput.value = (currentQty + 1.00).toFixed(2);
    } else {
        let tbody = document.getElementById('saleItemsBody');
        let tr = document.createElement('tr');
        tr.id = 'row-item-' + item.id;
        tr.innerHTML = `
            <td>
                <strong>${item.name}</strong>
                <input type="hidden" name="item_id[]" value="${item.id}">
            </td>
            <td>
                <input type="number" step="0.01" min="0.01" name="quantity[]" value="1.00" class="form-control item-qty" required>
            </td>
            <td>${item.unit}</td>
            <td>
                <button type="button" class="btn btn-sm btn-outline-danger" onclick="document.getElementById('row-item-${item.id}').remove()">Удалить</button>
            </td>
        `;
        tbody.appendChild(tr);
    }
}

function addManualRow() {
    let tbody = document.getElementById('saleItemsBody');
    let tr = document.createElement('tr');
    let options = availableItems.map(i => `<option value="${i.id}">${i.name} (${i.unit})</option>`).join('');
    tr.innerHTML = `
        <td>
            <select name="item_id[]" class="form-select" required>
                <option value="">Выберите товар...</option>
                ${options}
            </select>
        </td>
        <td>
            <input type="number" step="0.01" min="0.01" name="quantity[]" value="1.00" class="form-control item-qty" required>
        </td>
        <td>кг/шт</td>
        <td>
            <button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('tr').remove()">Удалить</button>
        </td>
    `;
    tbody.appendChild(tr);
}

document.getElementById('salesForm').addEventListener('submit', function() {
    let btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = 'Сохранение...';
});
</script>
{% endblock %}
