<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Печать этикеток</title>
    <style>
        :root { --lw: 58mm; --lh: 40mm; }
        body { font-family: Arial, sans-serif; margin: 0; padding: 10px; background: #fff; color: #000; }
        .toolbar { text-align: center; margin-bottom: 14px; }
        .toolbar select, .toolbar input, .toolbar button { font-size: 15px; padding: 6px 10px; margin: 0 4px; }
        .toolbar button { background: #198754; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
        .toolbar a { margin-left: 12px; color: #333; text-decoration: none; }
        .sheet { display: flex; flex-wrap: wrap; gap: 3mm; justify-content: center; }
        .label {
            width: var(--lw); height: var(--lh); box-sizing: border-box;
            border: 1px dashed #bbb; padding: 1.5mm; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            page-break-inside: avoid; break-inside: avoid; text-align: center;
        }
        .label .name { font-size: 11px; font-weight: bold; line-height: 1.15; max-height: 2.4em; overflow: hidden; margin-bottom: 1mm; }
        .label svg { width: 100%; height: auto; max-height: calc(var(--lh) - 14mm); }
        @media print {
            .toolbar { display: none; }
            body { padding: 0; }
            .sheet { gap: 0; justify-content: flex-start; }
            .label { border: none; }
            body.thermal .label { page-break-after: always; break-after: page; }
        }
    </style>
    <style id="pageStyle"></style>
</head>
<body>
    <div class="toolbar">
        <label>Формат:
            <select id="fmt">
                <option value="thermal">Термопринтер 58×40 мм</option>
                <option value="thermal2">Термопринтер 40×30 мм</option>
                <option value="a4">Обычный принтер (A4, сетка)</option>
            </select>
        </label>
        <label>Копий:
            <input type="number" id="copies" value="1" min="1" max="100" style="width:64px;">
        </label>
        <button onclick="window.print()">🖨️ Печать</button>
        <a href="{{ url_for('directory') }}">← К справочнику</a>
    </div>

    <div class="sheet" id="sheet">
        {% for it in labels %}
        <div class="label" data-code="{{ it.barcode }}">
            <div class="name">{{ it.name }}</div>
            <svg class="bc"></svg>
        </div>
        {% endfor %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <script>
    const sheet = document.getElementById('sheet');
    const base = Array.from(sheet.children).map(function (el) { return el.cloneNode(true); });

    function render() {
        const copies = Math.max(1, Math.min(100, parseInt(document.getElementById('copies').value, 10) || 1));
        const fmt = document.getElementById('fmt').value;
        const sizes = { thermal: ['58mm', '40mm'], thermal2: ['40mm', '30mm'], a4: ['62mm', '36mm'] };
        const sz = sizes[fmt];
        document.documentElement.style.setProperty('--lw', sz[0]);
        document.documentElement.style.setProperty('--lh', sz[1]);
        document.body.classList.toggle('thermal', fmt !== 'a4');
        document.getElementById('pageStyle').textContent = fmt === 'a4'
            ? '@page { size: A4; margin: 8mm; }'
            : '@page { size: ' + sz[0] + ' ' + sz[1] + '; margin: 0; }';
        sheet.innerHTML = '';
        base.forEach(function (tpl) {
            for (let i = 0; i < copies; i++) sheet.appendChild(tpl.cloneNode(true));
        });
        sheet.querySelectorAll('.label').forEach(function (el) {
            JsBarcode(el.querySelector('svg'), el.dataset.code, {
                format: 'CODE128', width: 2, height: 60, displayValue: true,
                fontSize: 14, margin: 4, textMargin: 2
            });
        });
    }
    document.getElementById('fmt').addEventListener('change', render);
    document.getElementById('copies').addEventListener('input', render);
    render();
    </script>
</body>
</html>
