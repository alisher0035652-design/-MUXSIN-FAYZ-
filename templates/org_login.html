<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ввод ПИН-кода — {{ org_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border: none;
            border-radius: 15px;
            max-width: 400px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center">
        <div class="card login-card shadow p-4 bg-white text-center">
            <div class="card-body">
                <div class="fs-1 mb-2">🔐</div>
                <h3 class="card-title fw-bold text-dark mb-1">Авторизация</h3>
                <p class="text-muted small mb-4">{{ org_name }}</p>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-danger py-2 mb-3 small" role="alert">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form action="{{ url_for('org_login', org_name=org_name) }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label text-muted small">Введите 4-значный ПИН-код</label>
                        <input type="password" name="pin" class="form-control text-center fs-4 tracking-widest" maxlength="4" pattern="[0-9]{4}" placeholder="••••" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Войти</button>
                    <a href="{{ url_for('index') }}" class="text-decoration-none small text-muted">← Назад к выбору организации</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
