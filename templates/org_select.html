<!DOCTYPE html>

            background-color: #f8f9fa;
            height: 100vh;
            display: flex;

            justify-content: center;
        }
        .org-card {
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: none;
            border-radius: 15px;
        }
        .org-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
    </style>
</head>

            <!-- Первая организация -->
            <div class="col-md-5">
                <div class="card org-card shadow-sm p-4 bg-white" onclick="location.href='{{ url_for('select_org', org_name='OTABEK UMAR FAYZ') }}'">

                        <div class="fs-1 mb-3">🏢</div>
                        <h3 class="card-title fw-bold text-primary">OTABEK UMAR FAYZ</h3>
                        <p class="text-muted small mb-3">ИНН: 311147751 | Бекобод тумани</p>
                        <span class="btn btn-outline-primary w-100">Выбрать организацию</span>
                    </div>
                </div>
            </div>

            <!-- Вторая организация -->

                        <div class="fs-1 mb-3">🏭</div>
                        <h3 class="card-title fw-bold text-success">ISMOIL-OMAD-FAYZ-555</h3>
                        <p class="text-muted small mb-3">ИНН: 310748843 | Бекобод тумани</p>
                        <span class="btn btn-outline-success w-100">Выбрать организацию</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
