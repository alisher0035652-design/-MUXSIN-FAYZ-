<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учет отгрузок — MUXSIN-FAYZ</title>
    <!-- Подключение Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal text-gray-800">

    <!-- Навигационная панель -->
    <nav class="bg-gray-900 text-white p-4 shadow-lg">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center">
            <div class="flex items-center space-x-6">
                <div class="flex items-center space-x-2">
                    <span class="text-xl font-bold tracking-wide text-blue-400">
                        🚚 MUXSIN-FAYZ
                    </span>
                </div>
                <div class="flex space-x-4 items-center">
                    <a href="/sales" class="hover:text-blue-400 text-sm font-medium transition text-blue-400">Отгрузки</a>
                    <a href="/directory" class="hover:text-blue-400 text-sm font-medium transition">Справочники</a>
                    
                    <!-- Ссылка на разнарядку -->
                    <a href="https://catering-0dk0.onrender.com" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-md text-sm font-semibold transition flex items-center space-x-1 shadow">
                        <span>📊 Разнарядка</span>
                        <svg class="w-3.5 h-3.5 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                        </svg>
                    </a>
                </div>
            </div>
            <div>
                <a href="/select_org" class="bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-600 px-3 py-1.5 rounded-md text-xs font-medium transition">
                    🏠 Сменить организацию
                </a>
            </div>
        </div>
    </nav>

    <!-- Основной контент -->
    <main class="max-w-7xl mx-auto mt-6 px-4 pb-12 space-y-6">
        
        <h1 class="text-2xl font-bold text-gray-800">Отгрузки организации: MUXSIN-FAYZ</h1>

        <!-- Блок создания накладной -->
        <div class="bg-white shadow-md rounded-lg p-6 border border-gray-200">
            <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-4">Создать новую накладную (Автонумерация с 001001)</h2>
            
            <form method="POST" action="/sales/add" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Дата отгрузки</label>
                        <input type="date" name="date" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">МТТ (Общие)</label>
                        <select name="client_id" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" required>
                            <option value="">Выберите МТТ...</option>
                            <!-- Здесь ваши опции клиентов -->
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Позиции товаров (товары организации MUXSIN-FAYZ)</label>
                    <div class="flex items-center space-x-2">
                        <select name="item_id" class="flex-1 border border-gray-300 rounded-md px-3 py-2 text-sm">
                            <option value="">Выберите товар...</option>
                        </select>
                        <input type="number" step="0.01" name="quantity" placeholder="0.00" class="w-32 border border-gray-300 rounded-md px-3 py-2 text-sm text-center">
                        <button type="button" class="text-red-600 hover:text-red-800 px-2 font-bold">×</button>
                    </div>
                </div>

                <div>
                    <button type="button" class="text-blue-600 hover:text-blue-800 text-sm font-medium">+ Добавить еще товар</button>
                </div>

                <div class="pt-4 border-t">
                    <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2.5 rounded-md text-sm hover:bg-blue-700 transition shadow">
                        Провести и сохранить накладную
                    </button>
                </div>
            </form>
        </div>

        <!-- Фильтры -->
        <div class="bg-white shadow-md rounded-lg p-4 border border-gray-200 flex flex-wrap items-center gap-3">
            <div>
                <label class="text-xs font-medium text-gray-600 block mb-1">Фильтр по дате</label>
                <input type="date" class="border border-gray-300 rounded-md px-3 py-1.5 text-sm">
            </div>
            <div>
                <label class="text-xs font-medium text-gray-600 block mb-1">Фильтр по МТТ</label>
                <select class="border border-gray-300 rounded-md px-3 py-1.5 text-sm">
                    <option>Все МТТ</option>
                </select>
            </div>
            <div>
                <label class="text-xs font-medium text-gray-600 block mb-1">№ накладной</label>
                <input type="text" placeholder="001001" class="border border-gray-300 rounded-md px-3 py-1.5 text-sm">
            </div>
            <div class="self-end flex space-x-2 mt-auto">
                <button class="bg-gray-700 text-white px-4 py-1.5 rounded-md text-sm font-medium hover:bg-gray-800">Найти</button>
                <button class="bg-gray-200 text-gray-700 px-4 py-1.5 rounded-md text-sm font-medium hover:bg-gray-300">Сбросить</button>
                <button class="bg-green-600 text-white px-4 py-1.5 rounded-md text-sm font-medium hover:bg-green-700 flex items-center space-x-1">
                    <span>Excel</span>
                </button>
            </div>
        </div>

        <!-- Таблица накладных -->
        <div class="bg-white shadow-md rounded-lg overflow-hidden border border-gray-200">
            <table class="min-w-full divide-y divide-gray-200 text-sm">
                <thead class="bg-gray-100 text-gray-700">
                    <tr>
                        <th class="px-4 py-3 text-left font-bold">№ Накладной</th>
                        <th class="px-4 py-3 text-left font-bold">Дата</th>
                        <th class="px-4 py-3 text-left font-bold">МТТ</th>
                        <th class="px-4 py-3 text-left font-bold">Состав накладной (Товары)</th>
                        <th class="px-4 py-3 text-center font-bold">Действия</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200 bg-white">
                    <tr class="hover:bg-gray-50">
                        <td class="px-4 py-3 font-semibold text-gray-900">001001</td>
                        <td class="px-4 py-3 text-gray-600">16.10.2026</td>
                        <td class="px-4 py-3 text-gray-600">Город — МТТ №1</td>
                        <td class="px-4 py-3 text-gray-600">Нон (10000.00 кг)</td>
                        <td class="px-4 py-3 text-center space-x-2">
                            <button class="text-gray-600 hover:text-blue-600" title="Печать">🖨️</button>
                            <button class="text-blue-600 hover:text-blue-800" title="Редактировать">✏️</button>
                            <button class="text-red-600 hover:text-red-800" title="Удалить">×</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

</body>
</html>
