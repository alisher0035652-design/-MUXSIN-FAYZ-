<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Учет отгрузок{% endblock %}</title>
    <!-- Подключение Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal text-gray-800">

    <!-- Навигационная панель -->
    <nav class="bg-gray-900 text-white p-4 shadow-lg">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center">
            <div class="flex items-center space-x-6">
                <div class="flex items-center space-x-2">
                    <span class="text-xl font-bold tracking-wide text-blue-400">
                        🚚 {{ session.get('organization', 'MUXSIN-FAYZ') }}
                    </span>
                </div>
                <div class="flex space-x-4 items-center">
                    <a href="/sales" class="hover:text-blue-400 text-sm font-medium transition">Отгрузки</a>
                    <a href="/directory" class="hover:text-blue-400 text-sm font-medium transition">Справочники</a>
                    
                    <!-- Ссылка на разнарядку (отображается ТОЛЬКО для MUXSIN-FAYZ) -->
                    {% if session.get('organization') == 'MUXSIN-FAYZ' or not session.get('organization') %}
                    <a href="https://catering-0dk0.onrender.com" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-md text-sm font-semibold transition flex items-center space-x-1 shadow">
                        <span>📊 Разнарядка</span>
                        <svg class="w-3.5 h-3.5 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                        </svg>
                    </a>
                    {% endif %}
                </div>
            </div>
            <div>
                <a href="/select_org" class="bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-600 px-3 py-1.5 rounded-md text-xs font-medium transition">
                    🏠 Сменить организацию
                </a>
            </div>
        </div>
    </nav>

    <!-- Основной контент страницы -->
    <main class="max-w-7xl mx-auto mt-6 px-4 pb-12">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
