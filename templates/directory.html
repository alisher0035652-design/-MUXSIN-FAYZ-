<!-- Добавление сотрудника -->
<form action="{{ url_for('add_user') }}" method="POST" class="row g-3 mb-4">
    <div class="col-md-3">
        <input type="text" name="username" class="form-control" placeholder="Логин (например, islom)" required>
    </div>
    <div class="col-md-3">
        <input type="text" name="password" class="form-control" placeholder="Пароль" required>
    </div>
    <div class="col-md-3">
        <input type="text" name="full_name" class="form-control" placeholder="ФИО сотрудника" required>
    </div>
    <div class="col-md-2">
        <select name="role" class="form-select">
            <option value="manager">Менеджер</option>
            <option value="supplier">Снабженец</option>
            <option value="admin">Администратор</option>
        </select>
    </div>
    <div class="col-md-1">
        <button type="submit" class="btn btn-success w-100">+</button>
    </div>
</form>

<!-- Список сотрудников с отображением паролей -->
<table class="table table-bordered">
    <thead>
        <tr>
            <th>Логин</th>
            <th>Пароль</th>
            <th>ФИО</th>
            <th>Роль</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        {% for u in users_list %}
        <tr>
            <td>{{ u.username }}</td>
            <td><code>{{ u.clear_password }}</code></td>
            <td>{{ u.full_name }}</td>
            <td>
                {% if u.role == 'admin' %}Администратор
                {% elif u.role == 'supplier' %}Снабженец
                {% else %}Менеджер{% endif %}
            </td>
            <td>
                <!-- Кнопка редактирования или удаления -->
                <form action="{{ url_for('delete_user', id=u.id) }}" method="POST" style="display:inline;">
                    <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Удалить сотрудника?')">Удалить</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
