<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему — MUXSIN-FAYZ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { border: none; border-radius: 15px; max-width: 400px; width: 100%; }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center">
        <div class="card login-card shadow p-4 bg-white">
            <div class="card-body">
                <div class="text-center fs-1 mb-2">🚚</div>
                <h3 class="card-title fw-bold text-center text-dark mb-1">MUXSIN-FAYZ</h3>
                <p class="text-muted small text-center mb-4">Авторизация сотрудника</p>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category if category != 'error' else 'danger' }} py-2 mb-3 small" role="alert">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Логин сотрудника</label>
                        <input type="text" name="username" class="form-control" placeholder="admin" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Пароль</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Войти в систему</button>
                </form>
                <div class="text-center text-muted small mt-3">
                    По умолчанию: логин <b>admin</b>, пароль <b>admin123</b>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
