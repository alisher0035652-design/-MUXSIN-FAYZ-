{% extends "base.html" %}
{% block content %}
<h2>Редактирование накладной № {{ doc.doc_number }}</h2>

<div class="card shadow-sm mb-4 mt-3">
    <div class="card-header bg-primary text-white">Изменить данные накладной</div>
    <div class="card-body">
        <form action="{{ url_for('edit_sale', doc_id=doc.id) }}" method="POST">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Дата отгрузки</label>
                    <input type="date" name="date" class="form-control" value="{{ doc.date }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">МТТ</label>
                    <select name="client_id" class="form-select" required>
                        {% for client in clients %}
                        <option value="{{ client.id }}" {% if client.id == doc.client_id %}selected{% endif %}>
                            {{ client.category }} — МТТ №{{ client.client_number }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <hr>
            <h5>Позиции товаров</h5>
            <div id="items-container">
                {% for s_item in sale_items %}
                <div class="row g-2 mb-2 item-row align-items-center">
                    <div class="col-md-7">
                        <select name="item_id[]" class="form-select" required>
                            {% for item in items %}
                            <option value="{{ item.id }}" {% if item.id == s_item.item_id %}selected{% endif %}>
                                {{ item.name }} (Ед: {{ item.unit }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <input type="number" step="0.01" name="quantity[]" class="form-control" value="{{ '%.2f'|format(s_item.quantity|float) }}" required>
                    </div>
                    <div class="col-md-1">
                        <button type="button" class="btn btn-outline-danger w-100" onclick="removeItemRow(this)">×</button>
                    </div>
                </div>
                {% endfor %}
            </div>

            <button type="button" class="btn btn-outline-secondary btn-sm mt-2 mb-3" onclick="addItemRow()">+ Добавить еще товар</button>
            
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success flex-grow-1">Сохранить изменения</button>
                <a href="{{ url_for('sales') }}" class="btn btn-secondary">Отмена</a>
            </div>
        </form>
    </div>
</div>

<script>
function addItemRow() {
    const container = document.getElementById('items-container');
    const firstRow = container.querySelector('.item-row');
    const newRow = firstRow.cloneNode(true);
    newRow.querySelector('input').value = '';
    container.appendChild(newRow);
}

function removeItemRow(btn) {
    const rows = document.querySelectorAll('.item-row');
    if (rows.length > 1) {
        btn.closest('.item-row').remove();
    } else {
        alert('В накладной должна быть хотя бы одна позиция товара.');
    }
}
</script>
{% endblock %}
